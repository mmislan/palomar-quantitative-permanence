  "project": {
    "name": "Quantitative permanence and recovery with vanishing reverse rates",
    "description": "Quantitative permanence and recovery bounds are established for mass-action systems with vanishing reverse rates. For a finite weakly reversible network with rates proportional to powers of epsilon, eventual concentration bounds depend on the spread of the rate exponents, with geometric constants chosen before the individual rates. For an explicit three-species network, a prepared region admits global positive solutions with three distinct concentration scales. Every prepared solution reaches and remains in a smaller target by time (31/10)/(p^2 h^7), while an explicit prepared solution cannot enter before 400/(1313 p^2 h^7). Inventory inequalities give additional necessary restoration and depletion times from arbitrary positive initial states. A continuous reverse-exponent family retains arbitrary admitted prefactors and yields matching worst-case prepared recovery orders, together with exact common-clock transport, preparation identities and cumulative reverse-reaction bounds. Abstract constant-capacity and open-range state-dependent inventory comparisons are included without assuming monotone inventories.",
